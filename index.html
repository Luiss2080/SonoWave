<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Ondas Sonoras - UPDS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/assets/styles/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1><i class="fas fa-wave-square"></i> Simulador de Ondas Sonoras</h1>
            <p class="subtitle">Laboratorio Virtual de Acústica y Propagación</p>
            <p class="academic-credit">Universidad Privada Domingo Savio</p>
        </header>
        
        <div class="main-content">
            <!-- Área de Simulación -->
            <div class="simulation-area">
                <div class="canvas-container" id="contenedorCanvas" title="Área de propagación de la onda sonora">
                    <div id="marcadorCentro"><i class="fas fa-crosshairs"></i> Presión en el Centro</div>
                </div>
                
                <!-- Controles de reproducción inferiores -->
                <div class="playback-controls card-style">
                    <div class="btn-group">
                        <button id="btnPlayPause" class="action-btn" title="Pausar o reanudar la simulación">
                            <i class="fas fa-pause"></i> <span>Pausar</span>
                        </button>
                        <button id="btnPaso" class="action-btn secondary" title="Avanzar paso a paso">
                            <i class="fas fa-forward-step"></i> Paso
                        </button>
                    </div>
                    
                    <div class="radio-group horizontal" title="Cambia el tipo de emisión">
                        <span><i class="fas fa-broadcast-tower"></i> Emisión:</span>
                        <label><input type="radio" name="modoEmision" value="continuo" checked> Continuo</label>
                        <label><input type="radio" name="modoEmision" value="pulso"> Pulso</label>
                    </div>

                    <div class="radio-group horizontal" title="Velocidad del tiempo en la simulación">
                        <span><i class="fas fa-clock"></i> Tiempo:</span>
                        <label><input type="radio" name="velocidad" value="normal" checked> Normal</label>
                        <label><input type="radio" name="velocidad" value="lento"> Lento</label>
                    </div>
                </div>
            </div>
            
            <!-- Panel de Controles -->
            <aside class="sidebar-controls">
                <!-- Parámetros -->
                <div class="control-card">
                    <h3><i class="fas fa-sliders"></i> Parámetros</h3>
                    <div class="control-group" title="Modifica la frecuencia de la onda">
                        <div class="label-row">
                            <label for="sliderFrecuencia">Frecuencia</label>
                            <span class="value-display"><span id="valorFrecuencia">2.0</span> Hz</span>
                        </div>
                        <input type="range" id="sliderFrecuencia" min="1" max="5" step="0.1" value="2">
                    </div>

                    <div class="control-group" title="Modifica la amplitud o intensidad de la onda">
                        <div class="label-row">
                            <label for="sliderAmplitud">Amplitud</label>
                            <span class="value-display"><span id="valorAmplitud">50</span>%</span>
                        </div>
                        <!-- Amplitud mínima ahora es 0 para permitir apagar el bombeo -->
                        <input type="range" id="sliderAmplitud" min="0" max="100" step="5" value="50">
                    </div>
                </div>

                <!-- Visualización -->
                <div class="control-card">
                    <h3><i class="fas fa-eye"></i> Visualización</h3>
                    <div class="checkbox-group">
                        <label title="Muestra u oculta la gráfica de presión"><input type="checkbox" id="checkGraficas" checked> Mostrar Gráficas</label>
                        <label title="Activa el sonido real"><input type="checkbox" id="checkSonido" checked> Reproducir Tono</label>
                    </div>
                    
                    <div class="divider"></div>
                    
                    <div class="radio-group vertical" title="Elige qué elementos visuales renderizar">
                        <label><input type="radio" name="modoVista" value="ondas"> Solo Ondas</label>
                        <label><input type="radio" name="modoVista" value="particulas"> Solo Partículas</label>
                        <label><input type="radio" name="modoVista" value="ambos" checked> Ambos Modos</label>
                    </div>
                </div>

                <button id="btnReiniciar" class="danger-btn" title="Vuelve a los valores por defecto">
                    <i class="fas fa-undo"></i> Reiniciar Simulación
                </button>
            </aside>
        </div>
    </div>
    <script type="module" src="/src/principal.js"></script>
</body>
</html>
